<div class="bg-slate-800/80 border border-slate-700/70 hover:border-slate-600 rounded-xl p-3.5 space-y-2.5 transition-all shadow-sm group">
    <div class="flex items-center justify-between gap-1">
        <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded {% if app.opp_type == 'scholarship' %}bg-purple-500/20 text-purple-300{% elif app.opp_type == 'job' %}bg-emerald-500/20 text-emerald-300{% else %}bg-blue-500/20 text-blue-300{% endif %}">
            {{ app.opp_type }}
        </span>
        <span class="text-[11px] font-bold text-emerald-400 bg-emerald-500/10 px-1.5 py-0.5 rounded">
            {{ app.match_score }}% Match
        </span>
    </div>

    <div>
        <h4 class="text-xs font-bold text-white group-hover:text-blue-400 transition-colors line-clamp-2 leading-snug">
            <a href="/copilot/{{ app.opportunity_id }}">{{ app.opp_title }}</a>
        </h4>
        <div class="text-[11px] text-slate-400 mt-1 flex items-center gap-1">
            <i data-lucide="building" class="w-3 h-3 text-slate-500"></i>
            <span class="truncate">{{ app.opp_org }}</span>
        </div>
    </div>

    <div class="text-[11px] text-slate-300 flex items-center justify-between pt-1 border-t border-slate-700/60">
        <span class="flex items-center gap-1">
            <i data-lucide="map-pin" class="w-3 h-3 text-slate-400"></i> {{ app.opp_country }}
        </span>
        {% if app.opp_deadline %}
        <span class="text-amber-300 font-medium flex items-center gap-1">
            <i data-lucide="clock" class="w-3 h-3"></i> {{ app.opp_deadline }}
        </span>
        {% endif %}
    </div>

    <!-- Quick stage shifter -->
    <div class="pt-2 flex items-center justify-between gap-1.5">
        <select onchange="moveCardStatus({{ app.id }}, this.value)" class="text-[10px] bg-slate-900 border border-slate-700 rounded px-1.5 py-1 text-slate-300 focus:outline-none focus:border-blue-500 w-full">
            <option value="bookmarked" {% if app.status == 'bookmarked' %}selected{% endif %}>📌 Bookmarked</option>
            <option value="tailoring" {% if app.status == 'tailoring' %}selected{% endif %}>✍️ Tailoring</option>
            <option value="ready" {% if app.status == 'ready' %}selected{% endif %}>🚀 Ready</option>
            <option value="applied" {% if app.status == 'applied' %}selected{% endif %}>✅ Submitted</option>
            <option value="interview" {% if app.status == 'interview' %}selected{% endif %}>🎉 Interview</option>
            <option value="accepted" {% if app.status == 'accepted' %}selected{% endif %}>🏆 Awarded</option>
        </select>
        <a href="/copilot/{{ app.opportunity_id }}" class="p-1 rounded bg-slate-700 hover:bg-slate-600 text-slate-200 transition-colors flex-shrink-0" title="Open Copilot Studio">
            <i data-lucide="sparkles" class="w-3.5 h-3.5 text-blue-400"></i>
        </a>
    </div>
</div>
